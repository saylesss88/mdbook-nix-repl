[package]
name = "mdbook-nix-repl"
version = "0.6.8"
edition = "2024"
authors = ["T. Sawyer saylesss88@github.com"]
license = "Apache-2.0"
description = "An mdBook preprocessor to provide nix-repl functionality within mdbook"
repository = "https://github.com/saylesss88/mdbook-nix-repl"
readme = "README.md"
keywords = ["mdbook", "nix", "repl", "preprocessor"]
categories = [
	"command-line-utilities",
	"development-tools::build-utils",
	"web-programming",
]
homepage = "https://github.com/saylesss88/mdbook-nix-repl"
include = [
	"src/**/*",
	"Cargo.toml",
	"README.md",
	"LICENSE",
	"theme/nix_http.js",
	"server/Cargo.toml.inc",
	"server/Dockerfile",
	"server/src/**/*",
]

[dependencies]
mdbook-preprocessor = "0.5.3"
anyhow = {version = "1.0", default-features = false}
env_logger = {version = "0.11", default-features = false}
serde = {version = "1.0", default-features = false}
serde_json = "1.0"
html-escape = {version = "0.2", default-features = false}
semver = "1.0"
clap = {version = "4", features = ["derive"]}
rand = {version = "0.10.1", features = ["sys_rng"], default-features = false}
hex = {version = "0.4.3", features = ["alloc"], default-features = false}
toml = {version = "1.1.2", default-features = false}
url = {version = "2.5", default-features = false}
